<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="style.css" />
    <title>Reto01</title>
  </head>
  <body>
    <main class="app">
      <label class="toggle-control" for="modo">
        <input type="checkbox" id="modo" />
        <span class="control"></span>
      </label>

      <h1>Conversor de divisas</h1>

      <section class="converter">
        <input type="number" id="cantidad" placeholder="Cantidad" />
        <select id="divisa">
          <option value="usd">USD</option>
          <option value="euro">EUR</option>
        </select>
        <button id="conversion">Conversion</button>
      </section>

      <p id="resultado"></p>
      <img src=https://upload.wikimedia.org/wikipedia/commons/8/8f/Euro_symbol.svg?utm_source=commons.wikimedia.org&utm_campaign=index&utm_content=original
      alt="Bitcoin Logo" id="pic" />
    </main>

    <script src="main.js"></script>
  </body>
</html>
